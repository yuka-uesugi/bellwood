<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- 空のグラデーション -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0f5"/>
      <stop offset="55%" stop-color="#e3f1fa"/>
      <stop offset="100%" stop-color="#fbfdff"/>
    </linearGradient>
    <!-- 太陽の柔らかい光 -->
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fdf3d8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fbeec4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbeec4" stop-opacity="0"/>
    </radialGradient>
    <!-- 遠景の丘 -->
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9dcd0"/>
      <stop offset="100%" stop-color="#e4efe7"/>
    </linearGradient>
    <!-- ビル面 -->
    <linearGradient id="bldgFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3d6e6"/>
      <stop offset="100%" stop-color="#d8e6f0"/>
    </linearGradient>
    <linearGradient id="bldgMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c2d8"/>
      <stop offset="100%" stop-color="#c2d5e5"/>
    </linearGradient>
    <linearGradient id="bldgNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fadc9"/>
      <stop offset="100%" stop-color="#b0c8dc"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- 空 -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- 太陽の光（右上） -->
  <circle cx="1520" cy="180" r="360" fill="url(#sun)"/>

  <!-- 雲 -->
  <g fill="#ffffff" filter="url(#soft)">
    <g opacity="0.9">
      <ellipse cx="360" cy="200" rx="180" ry="42"/>
      <ellipse cx="460" cy="170" rx="120" ry="36"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="1180" cy="120" rx="150" ry="34"/>
      <ellipse cx="1270" cy="95" rx="90" ry="26"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="820" cy="300" rx="130" ry="28"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="1650" cy="330" rx="160" ry="30"/>
    </g>
  </g>

  <!-- 遠景の丘（青葉区の緑） -->
  <path d="M0 720 Q 240 640 480 690 T 960 680 T 1440 690 T 1920 660 L1920 1080 L0 1080 Z" fill="url(#hills)"/>

  <!-- 遠景ビル群 -->
  <g fill="url(#bldgFar)">
    <rect x="90"   y="620" width="90"  height="460" rx="3"/>
    <rect x="240"  y="660" width="70"  height="420" rx="3"/>
    <rect x="420"  y="600" width="80"  height="480" rx="3"/>
    <rect x="700"  y="640" width="95"  height="440" rx="3"/>
    <rect x="1000" y="610" width="75"  height="470" rx="3"/>
    <rect x="1260" y="650" width="85"  height="430" rx="3"/>
    <rect x="1560" y="620" width="80"  height="460" rx="3"/>
    <rect x="1780" y="655" width="90"  height="425" rx="3"/>
  </g>

  <!-- 中景ビル群 -->
  <g fill="url(#bldgMid)">
    <rect x="0"    y="760" width="130" height="320" rx="4"/>
    <rect x="180"  y="800" width="110" height="280" rx="4"/>
    <rect x="330"  y="740" width="90"  height="340" rx="4"/>
    <rect x="530"  y="780" width="120" height="300" rx="4"/>
    <rect x="760"  y="750" width="100" height="330" rx="4"/>
    <rect x="930"  y="790" width="130" height="290" rx="4"/>
    <rect x="1130" y="745" width="95"  height="335" rx="4"/>
    <rect x="1330" y="785" width="120" height="295" rx="4"/>
    <rect x="1530" y="750" width="105" height="330" rx="4"/>
    <rect x="1720" y="790" width="130" height="290" rx="4"/>
  </g>

  <!-- 中景ビルの窓（さりげなく） -->
  <g fill="#ffffff" opacity="0.35">
    <rect x="352" y="770" width="46" height="8" rx="2"/>
    <rect x="352" y="800" width="46" height="8" rx="2"/>
    <rect x="352" y="830" width="46" height="8" rx="2"/>
    <rect x="782" y="780" width="56" height="8" rx="2"/>
    <rect x="782" y="810" width="56" height="8" rx="2"/>
    <rect x="782" y="840" width="56" height="8" rx="2"/>
    <rect x="1152" y="775" width="51" height="8" rx="2"/>
    <rect x="1152" y="805" width="51" height="8" rx="2"/>
    <rect x="1152" y="835" width="51" height="8" rx="2"/>
    <rect x="1552" y="780" width="61" height="8" rx="2"/>
    <rect x="1552" y="810" width="61" height="8" rx="2"/>
  </g>

  <!-- 近景の街並み（低層＋緑） -->
  <g fill="url(#bldgNear)">
    <rect x="60"   y="900" width="160" height="180" rx="5"/>
    <rect x="300"  y="930" width="140" height="150" rx="5"/>
    <rect x="620"  y="910" width="170" height="170" rx="5"/>
    <rect x="900"  y="940" width="150" height="140" rx="5"/>
    <rect x="1200" y="915" width="160" height="165" rx="5"/>
    <rect x="1480" y="935" width="150" height="145" rx="5"/>
    <rect x="1740" y="910" width="180" height="170" rx="5"/>
  </g>

  <!-- 街路樹（ロゴの木のモチーフ） -->
  <g>
    <g fill="#8fbf9a">
      <circle cx="255" cy="960" r="46"/>
      <circle cx="510" cy="975" r="52"/>
      <circle cx="845" cy="965" r="44"/>
      <circle cx="1115" cy="978" r="50"/>
      <circle cx="1415" cy="962" r="46"/>
      <circle cx="1680" cy="975" r="48"/>
    </g>
    <g fill="#6da87c" opacity="0.85">
      <circle cx="235" cy="985" r="34"/>
      <circle cx="488" cy="998" r="36"/>
      <circle cx="868" cy="988" r="32"/>
      <circle cx="1138" cy="1000" r="34"/>
      <circle cx="1438" cy="985" r="33"/>
      <circle cx="1702" cy="998" r="34"/>
    </g>
    <g fill="#7a6a52">
      <rect x="248" y="995" width="14" height="85" rx="4"/>
      <rect x="503" y="1010" width="14" height="70" rx="4"/>
      <rect x="838" y="1000" width="13" height="80" rx="4"/>
      <rect x="1108" y="1012" width="14" height="68" rx="4"/>
      <rect x="1408" y="998" width="13" height="82" rx="4"/>
      <rect x="1673" y="1010" width="14" height="70" rx="4"/>
    </g>
  </g>

  <!-- 手前を白へ溶かす（本文オーバーレイと馴染ませる） -->
  <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
  </linearGradient>
  <rect x="0" y="760" width="1920" height="320" fill="url(#fadeBottom)"/>
</svg>
